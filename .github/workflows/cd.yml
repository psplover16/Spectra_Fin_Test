name: CD

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deployment target
        run: node scripts/resolveDeploymentTarget.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build static site
        run: npm run build

      - name: Verify PWA output
        run: npm run check:pwa-output

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:gh-pages
            git worktree add .deploy-pages gh-pages
          else
            git worktree add --detach .deploy-pages
            git -C .deploy-pages checkout --orphan gh-pages
            find .deploy-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Sync build output
        run: node scripts/publishPages.mjs --worktree .deploy-pages --dist dist --target "$PUBLISH_TARGET"

      - name: Commit and push Pages content
        run: |
          git -C .deploy-pages add -A

          if git -C .deploy-pages diff --cached --quiet; then
            echo "No publish changes to commit for ${PUBLISH_TARGET}."
            exit 0
          fi

          git -C .deploy-pages commit -m "deploy: publish ${PUBLISH_TARGET}"
          git -C .deploy-pages push origin gh-pages
